name: Checks

on:
  workflow_call:
  pull_request:

jobs:
  client:
    name: Client — tsc + vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get latest code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps

      - name: Type-check
        run: |
          cd client
          npx tsc --noEmit

      - name: Unit tests
        run: |
          cd client
          npx vitest run

  server:
    name: Server — phpunit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get latest code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup PHP
        uses: shivammathur/setup-php@a4e22b60bbb9c1021113f2860347b0759f66fe5d # v2.30.0
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo, pdo_sqlite, sqlite3, bcmath

      - name: Install dependencies
        run: |
          cd laravel-server
          composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cd laravel-server
          cp .env.example .env
          php artisan key:generate

      - name: PHPUnit
        run: |
          cd laravel-server
          php artisan test
