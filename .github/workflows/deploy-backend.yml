name: Deploy Laravel Backend

on:
  push:
    branches:
      - main
    paths:
      - "laravel-server/**"
  workflow_dispatch:

# Two overlapping runs (a quick second push, or workflow_dispatch racing a
# push-triggered run) would otherwise race FTP-Deploy-Action's local state
# file and the actual upload order against api.dumosrx.com. Queue instead
# of cancelling, so an in-flight deploy always finishes rather than leaving
# a partial upload behind.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  web-deploy:
    name: 🎉 Deploy
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup PHP
        uses: shivammathur/setup-php@a4e22b60bbb9c1021113f2860347b0759f66fe5d # v2.30.0
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo, pdo_mysql

      - name: 📁 Setup Directory Structure
        run: |
          cd laravel-server
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          # 775, not 777: this deploys to shared hosting (no SSH, see
          # laravel-server/AGENTS.md), where file permissions are one of
          # the few isolation mechanisms between tenants on the box.
          # storage/ holds session files and bootstrap/cache/ holds
          # compiled config Laravel trusts implicitly on every request -
          # world-writable is broader than Laravel needs and a well-known
          # hardening anti-pattern.
          chmod -R 775 storage bootstrap/cache

      - name: 📦 Install Dependencies
        run: |
          cd laravel-server
          composer install --no-dev --optimize-autoloader

      - name: 📖 Generate API docs
        run: |
          cd laravel-server
          php artisan l5-swagger:generate

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /api.dumosrx.com/
          local-dir: ./laravel-server/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/*.key
            .env.example
            .env

      # This hosting has no SSH, so the deploy detects a pending migration
      # and refuses rather than applying one - see docs/FIXED_BUGS.md A-210.
      - name: 🧬 Check the deployed schema against the deployed code
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          url="${HEALTH_URL:-https://api.dumosrx.com/api/v1/health}?schema=1"
          body=$(curl -fsS --max-time 30 "$url" || true)
          echo "$body"
          case "$body" in
            *'"schema_current":true'*)
              echo "Schema matches this release." ;;
            *'"schema_current":false'*)
              echo "::error::The files are deployed but the database is behind this release. Open Admin > Maintenance > Pending migrations and run them now; the deploy does not run migrations."
              exit 1 ;;
            *)
              echo "::error::Could not read schema_current from $url after deploying. Check Admin > Operations > Database schema by hand before calling this release done."
              exit 1 ;;
          esac


