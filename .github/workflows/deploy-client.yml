name: Deploy Client App

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
  workflow_dispatch:

jobs:
  client-deploy:
    name: 🎉 Deploy Client
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@6012912aaf22240061e86622810ce5b80a13ad0d # v4.0.2
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd client
          rm package-lock.json
          npm install --legacy-peer-deps

      - name: 🏗️ Build Application
        run: |
          cd client
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.rx.dumostech.com/api/v1

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@548b1b65c2b0051e54c86a87754b2efc8f5647bd # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /app.rx.dumostech.com/
          local-dir: ./client/out/
