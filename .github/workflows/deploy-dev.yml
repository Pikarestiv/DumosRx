name: Deploy Dev Environment

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  # Fired by the dev API's storefront rebuild (STOREFRONT_REBUILD_EVENT). Runs
  # only deploy-web; GitHub reads this trigger from main, not dev.
  repository_dispatch:
    types: [storefront-changed-dev]

jobs:
  checks:
    if: github.event_name != 'repository_dispatch'
    uses: ./.github/workflows/checks.yml

  # One concurrency group per deploy target; see laravel-server/AGENTS.md (storefront rebuild pipeline).
  deploy-web:
    name: Build & Deploy Frontend (Dev)
    needs: [checks, deploy-backend]
    if: >-
      !cancelled() && (github.event_name == 'repository_dispatch'
      || (needs.checks.result == 'success' && needs.deploy-backend.result == 'success'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-web
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Static Site
        run: npm run build
        env:
          # Dev API URL
          NEXT_PUBLIC_API_URL: https://api.dev.dumosrx.com/api/v1
          NEXT_PUBLIC_APP_ENV: "development"
          # This site's own origin and the dashboard app it hands off to
          NEXT_PUBLIC_WEB_APP_URL: https://dev.dumosrx.com
          NEXT_PUBLIC_APP_URL: https://app.dev.dumosrx.com
          NEXT_PUBLIC_WEB_APP_DASHBOARD_URL: https://app.dev.dumosrx.com/dashboard
          # Ignore SSL errors during build (since new subdomains might still be provisioning AutoSSL)
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      - name: Sync Frontend files to FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /dev.dumosrx.com/
          local-dir: ./web/out/
          timeout: 1200000
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/_none/**
            **/_none

      - name: Confirm storefront rebuild to the API
        if: success() && github.event_name == 'repository_dispatch'
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "https://api.dev.dumosrx.com/api/v1/internal/storefront/rebuild-complete" \
            -H "Accept: application/json" \
            -H "X-Storefront-Rebuild-Token: ${{ secrets.DEV_STOREFRONT_REBUILD_TOKEN }}"

  deploy-client:
    name: Build & Deploy Client App (Dev)
    needs: checks
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-client-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps

      - name: 🏗️ Build Application
        run: |
          cd client
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.dev.dumosrx.com/api/v1
          NEXT_PUBLIC_WEB_APP_URL: https://dev.dumosrx.com
          NEXT_PUBLIC_SENTRY_DSN: https://8be353a77abf446cb9f6a52e08fb89b3@o4511910923796480.ingest.us.sentry.io/4511910931464192
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: development
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Ignore SSL errors during build (since the dev subdomain might still be provisioning AutoSSL)
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /app.dev.dumosrx.com/
          local-dir: ./client/out/
          timeout: 1200000

  deploy-backend:
    name: Build & Deploy Backend (Dev)
    needs: checks
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-backend-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup PHP
        uses: shivammathur/setup-php@a4e22b60bbb9c1021113f2860347b0759f66fe5d # v2.30.0
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo, pdo_mysql

      - name: Setup Directory Structure
        run: |
          cd laravel-server
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          # 775, not 777 - see deploy-backend.yml's identical step for why.
          chmod -R 775 storage bootstrap/cache

      - name: Install Dependencies
        run: |
          cd laravel-server
          composer install --no-dev --optimize-autoloader

      - name: Generate API docs
        run: |
          cd laravel-server
          php artisan l5-swagger:generate

      - name: Sync Backend files to FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The directory on the server for api dev
          server-dir: /api.dev.dumosrx.com/
          local-dir: ./laravel-server/
          timeout: 1200000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/*.key
            .env.example
            .env

      - name: 🧬 Check the deployed schema against the deployed code
        run: |
          url="https://api.dev.dumosrx.com/api/v1/health?schema=1"
          body=$(curl -fsS --max-time 30 "$url" || true)
          echo "$body"
          case "$body" in
            *'"schema_current":true'*)
              echo "Schema matches this release." ;;
            *'"schema_current":false'*)
              echo "::error::The files are deployed but the dev database is behind this release. Open Admin > Maintenance > Pending migrations on dev and run them, then re-run this workflow; the deploy does not run migrations."
              exit 1 ;;
            *)
              echo "::error::Could not read schema_current from $url after deploying. Check Admin > Operations > Database schema on dev by hand."
              exit 1 ;;
          esac
