name: Deploy Public Website

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:
  # Fired by the Laravel server (App\Console\Commands\RebuildStorefrontIfDirty)
  # when a store's online/slug settings changed - see that command and
  # Store::boot() for the debouncing that keeps this from firing on every
  # single toggle.
  repository_dispatch:
    types: [storefront-changed]

# Two overlapping runs (a quick second push, a repository_dispatch racing a
# push-triggered run, or workflow_dispatch racing either) would otherwise
# race FTP-Deploy-Action's local state file and the actual upload order
# against dumosrx.com. Queue instead of cancelling, so an in-flight deploy
# always finishes rather than leaving a partial upload behind.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Static Site
        run: npm run build
        env:
          # Production API URL
          NEXT_PUBLIC_API_URL: https://api.dumosrx.com/api/v1
          NEXT_PUBLIC_APP_ENV: "production"

      # Runs BEFORE the sync, because the sync deletes anything missing from
      # web/out/ — a build that lost storefront pages would otherwise take
      # every live storefront down. See docs/STOREFRONT_REVIEW.md (SF-P0-1).
      - name: Verify storefront pages were generated
        run: npm run verify:storefront-output
        env:
          NEXT_PUBLIC_API_URL: https://api.dumosrx.com/api/v1

      - name: Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /dumosrx.com/
          local-dir: ./web/out/
          timeout: 1200000
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # Tells the API the rebuild it asked for actually shipped, so
      # RebuildStorefrontIfDirty can clear storefront_dirty_at on SUCCESS
      # rather than on GitHub merely accepting the dispatch (SF-P2-3). The
      # server keeps the flags dirty and retries if this never arrives, so a
      # failed callback costs a duplicate rebuild, not a lost one — hence
      # continue-on-error. Until STOREFRONT_REBUILD_TOKEN is set both here and
      # as STOREFRONT_REBUILD_TOKEN in the API's .env, the server stays on its
      # old clear-on-dispatch behaviour and this step is a no-op.
      - name: Confirm storefront rebuild to the API
        if: success()
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "https://api.dumosrx.com/api/v1/internal/storefront/rebuild-complete" \
            -H "Accept: application/json" \
            -H "X-Storefront-Rebuild-Token: ${{ secrets.STOREFRONT_REBUILD_TOKEN }}"
