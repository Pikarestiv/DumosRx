name: Deploy Public Website

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@6012912aaf22240061e86622810ce5b80a13ad0d # v4.0.2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Static Site
        run: npm run build
        env:
          # Production API URL
          NEXT_PUBLIC_API_URL: https://api.rx.dumostech.com/api/v1

      - name: Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@548b1b65c2b0051e54c86a87754b2efc8f5647bd # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The directory on the server where the 'rx' subdomain points to
          server-dir: /rx.dumostech.com/
          local-dir: ./web/out/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
