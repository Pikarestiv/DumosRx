name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install apple-gcc42 || true

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install app dependencies
        run: |
          cd client
          npm install
      
      - name: Fix Tailwind/LightningCSS Native Bindings (Windows only)
        if: matrix.platform == 'windows-latest'
        run: |
          cd client
          npm install --force @tailwindcss/oxide-win32-x64-msvc lightningcss-win32-x64-msvc

      - name: Fix Tailwind/LightningCSS Native Bindings (Linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          cd client
          npm install --force @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu

      - name: Verify updater signing secrets are set
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ] || [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY and/or TAURI_SIGNING_PRIVATE_KEY_PASSWORD repo secrets are missing or empty. Tauri will build unsigned bundles (no .sig files), which makes deploy-ftp publish an updater.json with an empty 'platforms' object and silently breaks the in-app updater for every platform. Set both secrets (Settings > Secrets and variables > Actions) before releasing — the private key must match the pubkey in client/src-tauri/tauri.conf.json."
            exit 1
          fi

      - name: Build and Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: "DumosRx ${{ github.ref_name }}"
          releaseBody: "Automated release from GitHub Actions."
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeUpdaterJson: true

  release-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          key: android

      - name: Install app dependencies
        run: |
          cd client
          npm install

      - name: Fix Tailwind/LightningCSS Native Bindings (Linux only)
        run: |
          cd client
          npm install --force @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu

      - name: Build Android App (Release)
        run: |
          cd client
          NDK_HOME=$ANDROID_NDK_ROOT npm run tauri android build -- --apk

      - name: Locate APK Directory
        run: |
          echo "All generated APK files:"
          find client/src-tauri/gen/android/app/build/outputs/ -name "*.apk"
          APK_PATH=$(find client/src-tauri/gen/android/app/build/outputs/ -name "*.apk" | head -n 1)
          APK_DIR=$(dirname "$APK_PATH")
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV
          echo "Selected APK directory: $APK_DIR"

      - name: Sign APK
        id: sign_app
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: ${{ env.APK_DIR }}
          signingKeyBase64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare Signed APK for upload
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "${{ env.APK_DIR }}/DumosRx-Android.apk"
          echo "UPLOAD_FILE=${{ env.APK_DIR }}/DumosRx-Android.apk" >> $GITHUB_ENV

      - name: Prepare Unsigned APK for upload
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          APK_PATH=$(find ${{ env.APK_DIR }} -name "*.apk" | head -n 1)
          cp "$APK_PATH" "${{ env.APK_DIR }}/DumosRx-Android-unsigned.apk"
          echo "UPLOAD_FILE=${{ env.APK_DIR }}/DumosRx-Android-unsigned.apk" >> $GITHUB_ENV

      - name: Upload APK Release Asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.UPLOAD_FILE }}
          tag_name: ${{ github.ref_name }}

  deploy-ftp:
    needs: [release, release-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --dir release-assets

      - name: Generate updater.json
        run: |
          cd release-assets
          node -e "
            const fs = require('fs');
            const tag = '${{ github.ref_name }}';
            const version = tag.replace(/^v/, '');

            const files = fs.readdirSync('.');
            const sigFiles = files.filter(f => f.endsWith('.sig'));
            
            const platforms = {};
            
            for (const sigFile of sigFiles) {
              const sig = fs.readFileSync(sigFile, 'utf8').trim();
              const baseFile = sigFile.replace('.sig', '');
              
              let platform = '';
              if (baseFile.endsWith('.app.tar.gz')) {
                platform = baseFile.includes('aarch64') ? 'darwin-aarch64' : 'darwin-x86_64';
              } else if (baseFile.endsWith('.msi.zip')) {
                platform = 'windows-x86_64';
              } else if (baseFile.endsWith('.AppImage.tar.gz')) {
                platform = 'linux-x86_64';
              }
              
              if (platform) {
                platforms[platform] = {
                  signature: sig,
                  url: \`https://downloads.dumosrx.com/\${tag}/\${baseFile}\`
                };
              }
            }
            
            const updater = {
              version,
              notes: 'Update ' + version,
              pub_date: new Date().toISOString(),
              platforms
            };

            // Never publish a feed with no platforms — that silently breaks the
            // in-app updater for every user instead of failing the release.
            // This means the release job produced no .sig files (missing/invalid
            // TAURI_SIGNING_PRIVATE_KEY secrets), or gh release download found
            // no matching assets.
            if (Object.keys(platforms).length === 0) {
              console.error('No .sig files found among downloaded release assets — refusing to publish an empty updater.json.');
              console.error('Files present:', files.join(', ') || '(none)');
              process.exit(1);
            }

            const expected = ['darwin-aarch64', 'windows-x86_64', 'linux-x86_64'];
            const missing = expected.filter(p => !platforms[p]);
            if (missing.length > 0) {
              console.warn('Warning: updater.json is missing expected platform(s): ' + missing.join(', '));
            }

            fs.writeFileSync('updater.json', JSON.stringify(updater, null, 2));
            console.log('Generated updater.json:');
            console.log(JSON.stringify(updater, null, 2));
          "

      - name: Separate root files from binaries
        run: |
          mkdir -p root-assets
          if [ -f "release-assets/updater.json" ]; then
            mv release-assets/updater.json root-assets/
          else
            echo "Warning: release-assets/updater.json not found! Skipping move."
          fi
          cp .github/downloads-index.php root-assets/index.php

      - name: FTP Deploy Binaries to Version Folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./release-assets/
          server-dir: /downloads.dumosrx.com/${{ github.ref_name }}/
          state-name: .ftp-deploy-sync-state-${{ github.ref_name }}.json

      - name: FTP Deploy Root Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./root-assets/
          server-dir: /downloads.dumosrx.com/
          state-name: .ftp-deploy-sync-state-root.json
