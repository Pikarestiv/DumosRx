[package]
name = "app"
version = "0.0.33"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.11.1", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21" # must match the version wry links against for jni_handle() to type-check

# Vendored, locally-patched tauri-plugin-sql (see vendor/tauri-plugin-sql):
# caps the SQLite connection pool at 1 connection instead of sqlx's default
# (up to 10), since the plugin's execute()/select() IPC commands each
# independently acquire-and-release a pool connection with no way for JS
# callers to pin a multi-statement transaction to one connection — the
# stock upstream crate silently breaks BEGIN/.../COMMIT transactions issued
# from JS. Also sets busy_timeout/WAL/synchronous via connect_with so they
# apply to every connection the pool opens, not just a one-off PRAGMA call.
[patch.crates-io]
tauri-plugin-sql = { path = "vendor/tauri-plugin-sql" }
